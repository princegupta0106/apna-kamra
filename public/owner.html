<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Panel — Apna Kamra</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container inner">
    <a href="/" class="brand">Apna <span>Kamra</span></a>
    <div class="nav-links">
      <button class="btn btn-sm theme-toggle"></button>
      <span id="ownerLabel" style="color:var(--text-dim); font-size:13px;"></span>
      <button class="btn btn-sm btn-ghost" id="logoutBtn" style="display:none;">Logout</button>
    </div>
  </div>
</nav>

<div class="container section">

  <!-- LOGIN -->
  <div id="loginBox" class="panel-card" style="max-width:420px; margin:40px auto;">
    <h2 style="margin-bottom:18px;">Owner Login</h2>
    <div class="form-grid">
      <div class="full">
        <label>Mobile Number</label>
        <input type="tel" id="loginMobile" placeholder="10-digit mobile number">
      </div>
      <div class="full">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Password">
      </div>
    </div>
    <button class="btn btn-solid btn-block" id="loginBtn" style="margin-top:16px;">Login</button>
    <div id="loginMsg" style="margin-top:12px; color:#e57368; text-align:center;"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none;">
    <div class="section-title">My Properties</div>
    <div id="propsList"></div>
  </div>

  <!-- EDIT MODAL (inline panel) -->
  <div id="editPanel" style="display:none;" class="panel-card">
    <h3 style="margin-bottom:16px;">Edit Property</h3>
    <input type="hidden" id="editId">
    <div class="form-grid">
      <div class="full">
        <label>Property Name</label>
        <input type="text" id="f_name">
      </div>
      <div class="full">
        <label>Description</label>
        <textarea id="f_description" rows="4"></textarea>
      </div>
      <div>
        <label>Price - Single Sharing (₹/month)</label>
        <input type="number" id="f_price_single">
      </div>
      <div>
        <label>Price - Double Sharing (₹/month)</label>
        <input type="number" id="f_price_double">
      </div>
      <div>
        <label>Price - Triple Sharing (₹/month)</label>
        <input type="number" id="f_price_triple">
      </div>
      <div class="full">
        <label>Amenities</label>
        <div class="checkbox-grid" id="f_amenities"></div>
      </div>
      <div class="full">
        <label>Images</label>
        <input type="file" id="f_imageUpload" accept="image/*" multiple>
        <div class="thumb-row" id="f_images"></div>
      </div>
    </div>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn btn-solid" id="saveBtn">Save Changes</button>
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
    </div>
    <div id="editMsg" style="margin-top:12px; color:var(--text-dim);"></div>
  </div>

</div>

<script src="/js/main.js"></script>
<script>
let auth = JSON.parse(sessionStorage.getItem('ak_owner') || 'null');
let myProps = [];

function showDashboard(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('ownerLabel').textContent = `Logged in as ${auth.mobile}`;
  document.getElementById('logoutBtn').style.display = 'inline-flex';
  loadProperties();
}

document.getElementById('loginBtn').onclick = async ()=>{
  const mobile = document.getElementById('loginMobile').value.trim();
  const password = document.getElementById('loginPass').value;
  try{
    await apiSend(API + '/owner/login', 'POST', {mobile,password});
    auth = {mobile,password};
    sessionStorage.setItem('ak_owner', JSON.stringify(auth));
    showDashboard();
  }catch(e){
    document.getElementById('loginMsg').textContent = 'Invalid mobile or password.';
  }
};

document.getElementById('logoutBtn').onclick = ()=>{
  sessionStorage.removeItem('ak_owner');
  location.reload();
};

async function loadProperties(){
  const list = document.getElementById('propsList');
  list.innerHTML = '<div class="empty-state">Loading...</div>';
  try{
    myProps = await apiGet(`${API}/owner/properties?mobile=${auth.mobile}&password=${encodeURIComponent(auth.password)}`);
    if(!myProps.length){
      list.innerHTML = '<div class="empty-state">No properties assigned to your account yet. Contact admin.</div>';
      return;
    }
    list.innerHTML = `<div class="prop-grid">` + myProps.map(p=>`
      <div class="prop-card" style="cursor:default;">
        <div class="img-wrap">
          <img src="${(p.images && p.images[0]) || 'https://images.unsplash.com/photo-1555854877-bab0e564b8d5?q=80&w=900&auto=format&fit=crop'}">
        </div>
        <div class="body">
          <h3>${p.name}</h3>
          <div class="loc">${p.city_name} ${p.visible ? '<span class="badge visible-badge">Visible</span>' : '<span class="badge hidden-badge">Hidden</span>'}</div>
          <div class="price-row"><span class="price">${fmtPrice(p.lowest_price)}</span><span class="from">/month onwards</span></div>
          <div class="badge">👁 ${p.views} views</div>
          <button class="btn btn-sm" onclick="openEdit(${p.id})">Edit Details</button>
        </div>
      </div>
    `).join('') + `</div>`;
  }catch(e){
    list.innerHTML = '<div class="empty-state">Failed to load properties.</div>';
  }
}

let editImages = [];
function openEdit(id){
  const p = myProps.find(x=>x.id===id);
  document.getElementById('editId').value = p.id;
  document.getElementById('f_name').value = p.name;
  document.getElementById('f_description').value = p.description || '';
  document.getElementById('f_price_single').value = p.price_single || '';
  document.getElementById('f_price_double').value = p.price_double || '';
  document.getElementById('f_price_triple').value = p.price_triple || '';
  editImages = [...(p.images || [])];

  document.getElementById('f_amenities').innerHTML = AMENITIES.map(a=>`
    <label><input type="checkbox" value="${a}" class="f-amen-cb" ${p.amenities.includes(a)?'checked':''}> ${a}</label>
  `).join('');

  renderThumbs();
  document.getElementById('editPanel').style.display = 'block';
  document.getElementById('editPanel').scrollIntoView({behavior:'smooth'});
}

function renderThumbs(){
  document.getElementById('f_images').innerHTML = editImages.map((url,i)=>`
    <div class="thumb"><img src="${url}"><button class="rm" onclick="removeImg(${i})">&times;</button></div>
  `).join('');
}
function removeImg(i){ editImages.splice(i,1); renderThumbs(); }

document.getElementById('f_imageUpload').onchange = async (e)=>{
  const files = Array.from(e.target.files);
  for(const file of files){
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch(`${API}/upload?mobile=${auth.mobile}&password=${encodeURIComponent(auth.password)}`, {method:'POST', body:fd});
    const data = await res.json();
    if(data.url) editImages.push(data.url);
  }
  renderThumbs();
  e.target.value = '';
};

document.getElementById('cancelBtn').onclick = ()=>{ document.getElementById('editPanel').style.display='none'; };

document.getElementById('saveBtn').onclick = async ()=>{
  const id = document.getElementById('editId').value;
  const amenities = Array.from(document.querySelectorAll('.f-amen-cb:checked')).map(c=>c.value);
  try{
    await apiSend(`${API}/properties/${id}`, 'PUT', {
      mobile: auth.mobile, password: auth.password,
      name: document.getElementById('f_name').value,
      description: document.getElementById('f_description').value,
      price_single: Number(document.getElementById('f_price_single').value)||0,
      price_double: Number(document.getElementById('f_price_double').value)||0,
      price_triple: Number(document.getElementById('f_price_triple').value)||0,
      amenities, images: editImages
    });
    document.getElementById('editMsg').style.color = '#5ed697';
    document.getElementById('editMsg').textContent = 'Saved successfully!';
    document.getElementById('editPanel').style.display = 'none';
    loadProperties();
  }catch(e){
    document.getElementById('editMsg').style.color = '#e57368';
    document.getElementById('editMsg').textContent = 'Failed to save.';
  }
};

if(auth) showDashboard();
</script>
</body>
</html>
