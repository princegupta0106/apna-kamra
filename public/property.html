<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Apna Kamra — Property</title>
<meta name="description" id="pageDesc" content="View hostel and PG details on Apna Kamra.">
<meta property="og:title" id="ogTitle" content="Apna Kamra — Property">
<meta property="og:description" id="ogDesc" content="View hostel and PG details on Apna Kamra.">
<meta property="og:image" id="ogImage" content="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?q=80&w=1200&auto=format&fit=crop">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar scrolled">
  <div class="inner">
    <a href="/" class="brand">Apna <span>Kamra</span></a>
    <div class="nav-links">
      <button class="btn btn-sm theme-toggle"></button>
      <a href="/list-property.html" class="btn btn-sm">List Your Property</a>
    </div>
  </div>
</nav>

<!-- Property hero (populated by JS) -->
<div id="propHero" style="margin-top:68px;"></div>

<!-- Content -->
<div class="container" id="content" style="padding-top:32px; padding-bottom:60px;">
  <div class="empty-state">Loading property...</div>
</div>

<!-- FAQ -->
<div class="container" id="faqContainer" style="padding-bottom:0;"></div>

<div class="footer">
  <div class="container">
    <div class="brand-footer">Apna <span>Kamra</span></div>
    <div class="tagline">Your trusted directory for hostels & PGs across India</div>
    <div class="links">
      <a href="/list-property.html">List Your Property</a>
      <a href="/owner">Owner Login</a>
      <a href="/admin">Admin</a>
    </div>
  </div>
</div>

<script src="/js/main.js"></script>
<script>
const slug = location.pathname.split('/').pop();

async function load() {
  const el = document.getElementById('content');
  try {
    const p = await apiGet(`${API}/properties/${slug}`);

    // SEO
    const title = `${p.name} — Apna Kamra`;
    document.title = title;
    document.getElementById('pageTitle').textContent = title;
    const desc = `${p.name} in ${p.city_name}. ${p.description ? p.description.slice(0,120) + '...' : 'View prices, amenities and contact owner directly.'}`;
    document.getElementById('pageDesc').setAttribute('content', desc);
    document.getElementById('ogTitle').setAttribute('content', title);
    document.getElementById('ogDesc').setAttribute('content', desc);

    const images = p.images && p.images.length ? p.images : [
      'https://images.unsplash.com/photo-1555854877-bab0e564b8d5?q=80&w=1200&auto=format&fit=crop'
    ];
    if (images[0]) document.getElementById('ogImage').setAttribute('content', images[0]);

    // HERO — full bleed with first image
    document.getElementById('propHero').innerHTML = `
      <div class="property-hero">
        <div class="hero-bg" id="heroBg" style="background-image:url('${images[0]}')"></div>
        <div style="position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;">
          <div class="property-hero-content" style="max-width:var(--maxw);width:100%;margin:0 auto;">
            <div class="back-link" onclick="smartBack('/city/${p.city_slug}')" style="color:rgba(255,255,255,0.7);">← Back to ${p.city_name}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${statusBadges(p)}</div>
            <h1>${p.name}</h1>
            <div class="loc">${p.locality ? p.locality + ' · ' : ''}${p.city_name}${p.owner_name ? ' · Managed by ' + p.owner_name : ''}</div>
          </div>
        </div>
      </div>
    `;

    // THUMBNAIL STRIP (if >1 image)
    let thumbStrip = '';
    if (images.length > 1) {
      thumbStrip = `
        <div class="gallery-strip" id="galleryStrip">
          ${images.map((img,i) => `
            <div class="gthumb ${i===0?'active':''}" data-i="${i}" onclick="switchHeroImg(${i},'${img}')">
              <img data-src="${img}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 60'%3E%3Crect width='80' height='60' fill='%23141920'/%3E%3C/svg%3E" alt="">
            </div>
          `).join('')}
        </div>
      `;
    }

    el.innerHTML = `
      ${thumbStrip}

      <div class="detail-grid">
        <!-- LEFT -->
        <div>
          <div class="price-box">
            <div class="pbox"><div class="label">Single Sharing</div><div class="val">${fmtPrice(p.price_single)}</div></div>
            <div class="pbox"><div class="label">Double Sharing</div><div class="val">${fmtPrice(p.price_double)}</div></div>
            <div class="pbox"><div class="label">Triple Sharing</div><div class="val">${fmtPrice(p.price_triple)}</div></div>
          </div>

          <div class="section-title" style="margin-top:28px;">Amenities</div>
          <div class="gold-rule"><span>✦</span></div>
          <div class="amenity-tags">${amenityTags(p.amenities)}</div>

          <div class="section-title" style="margin-top:32px;">About this Property</div>
          <div class="gold-rule"><span>✦</span></div>
          <p style="color:var(--text-dim);line-height:1.9;font-size:15px;">${p.description ? p.description.replace(/\n/g,'<br>') : 'No description provided.'}</p>

          ${p.map_link ? `
            <a class="btn btn-ghost" href="${p.map_link}" target="_blank" style="margin-top:20px;display:inline-flex;">
              📍 View on Google Maps
            </a>
          ` : ''}
        </div>

        <!-- RIGHT STICKY -->
        <div class="sticky-side">
          <div style="text-align:center;padding:8px 0 16px;border-bottom:1px solid var(--card-border);">
            <div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;">Starting from</div>
            <div style="font-size:34px;font-weight:700;color:var(--accent);font-family:'Georgia',serif;">${fmtPrice(p.lowest_price)}</div>
            <div style="font-size:12px;color:var(--text-dim);">per month</div>
          </div>

          <div class="contact-box">
            <div style="color:var(--text-dim);font-size:13px;letter-spacing:0.5px;">Interested in this property?</div>
            <button class="btn btn-solid btn-block" id="showContactBtn" style="margin-top:12px;">Show Contact Number</button>
            <div id="contactResult"></div>
          </div>

          <button class="whatsapp-btn" id="whatsappBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Ask on WhatsApp
          </button>

          <div style="font-size:11px;color:var(--text-dim);text-align:center;line-height:1.6;">
            No booking fee. Contact the owner directly to confirm availability and pricing.
          </div>
        </div>
      </div>
    `;

    // lazy load thumbnails
    lazyLoadImages(document.getElementById('galleryStrip'));

    // impressions + visitor tracking
    ImpressionTracker.markNow(p.id);
    Visitor.trackProperty(p.id, p.city_name);

    // contact reveal
    document.getElementById('showContactBtn').onclick = async () => {
      try {
        const c = await apiGet(`${API}/properties/${slug}/contact`);
        document.getElementById('showContactBtn').style.display = 'none';
        document.getElementById('contactResult').innerHTML = `
          <div class="contact-number">${c.owner_mobile || 'Not available'}</div>
          ${c.owner_mobile ? `<a class="btn btn-solid btn-block" style="margin-top:12px;" href="tel:${c.owner_mobile}">Call Now</a>` : ''}
        `;
      } catch(e) {
        document.getElementById('contactResult').innerHTML = '<div style="color:var(--text-dim);margin-top:10px;">Could not load contact.</div>';
      }
    };

    // whatsapp
    document.getElementById('whatsappBtn').onclick = async () => {
      let ownerMobile = null;
      try { const c = await apiGet(`${API}/properties/${slug}/contact`); ownerMobile = c.owner_mobile; } catch(e) {}
      window.open(whatsappLink(p.name, p.slug, ownerMobile), '_blank');
    };

    // FAQ
    renderFAQs(document.getElementById('faqContainer'));

  } catch(e) {
    el.innerHTML = '<div class="empty-state">Property not found.</div>';
  }
}

// switch hero image from thumbnail strip
function switchHeroImg(i, src) {
  document.getElementById('heroBg').style.backgroundImage = `url('${src}')`;
  document.querySelectorAll('.gthumb').forEach((t,idx) => t.classList.toggle('active', idx===i));
}

load();
</script>
</body>
</html>
