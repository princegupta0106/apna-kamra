<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Apna Kamra — Property</title>
<meta name="description" id="pageDesc" content="View hostel and PG details, prices, amenities and contact the owner directly on Apna Kamra.">
<meta property="og:title" id="ogTitle" content="Apna Kamra — Property">
<meta property="og:description" id="ogDesc" content="View hostel and PG details on Apna Kamra.">
<meta property="og:image" id="ogImage" content="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?q=80&w=1200&auto=format&fit=crop">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container inner">
    <a href="/" class="brand">Apna <span>Kamra</span></a>
    <div class="nav-links">
      <button class="btn btn-sm theme-toggle"></button>
      <a href="/list-property.html" class="btn btn-sm">List Your Property</a>
    </div>
  </div>
</nav>

<div class="container section" id="content">
  <div class="empty-state">Loading property...</div>
</div>

<div class="footer">
  Apna Kamra — your trusted directory for hostels & PGs.
  <div class="links">
    <a href="/list-property.html">List Your Property</a>
    <a href="/owner">Owner Login</a>
    <a href="/admin">Admin</a>
  </div>
</div>

<script src="/js/main.js"></script>
<script>
const slug = location.pathname.split('/').pop();

async function load(){
  const el = document.getElementById('content');
  try{
    const p = await apiGet(`${API}/properties/${slug}`);
    document.title = `${p.name} — Apna Kamra`;
    document.getElementById('pageTitle').textContent = `${p.name} — Apna Kamra`;
    const desc = `${p.name} in ${p.city_name}. ${p.description ? p.description.slice(0,120) + '...' : 'View prices, amenities and contact owner on Apna Kamra.'}`;
    document.getElementById('pageDesc').setAttribute('content', desc);
    document.getElementById('ogTitle').setAttribute('content', `${p.name} — Apna Kamra`);
    document.getElementById('ogDesc').setAttribute('content', desc);
    if(p.images && p.images[0]) document.getElementById('ogImage').setAttribute('content', p.images[0]);

    const images = p.images && p.images.length ? p.images : ['https://images.unsplash.com/photo-1555854877-bab0e564b8d5?q=80&w=1200&auto=format&fit=crop'];

    let mapBtn = '';
    if(p.map_link){
      mapBtn = `<a class="btn btn-ghost" href="${p.map_link}" target="_blank" style="margin-top:10px;">📍 View on Google Maps</a>`;
    }

    el.innerHTML = `
      <div class="back-link" onclick="smartBack('/city/${p.city_slug}')">&larr; Back to ${p.city_name}</div>

      <div class="gallery">
        ${images.map((img,i) => `<div class="gallery-item" data-i="${i}"><img data-src="${img}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect width='400' height='300' fill='%23222'/%3E%3C/svg%3E" alt="${p.name}"></div>`).join('')}
      </div>

      <div style="margin-top:20px;">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">${statusBadges(p)}</div>
        <h1 style="font-size:26px;">${p.name}</h1>
        <div class="loc" style="margin-top:6px;">${p.locality ? p.locality + ', ' : ''}${p.city_name}${p.owner_name ? ' • Managed by ' + p.owner_name : ''}</div>
      </div>

      <div class="detail-grid">
        <div>
          <div class="price-box">
            <div class="pbox">
              <div class="label">Single Sharing</div>
              <div class="val">${fmtPrice(p.price_single)}</div>
            </div>
            <div class="pbox">
              <div class="label">Double Sharing</div>
              <div class="val">${fmtPrice(p.price_double)}</div>
            </div>
            <div class="pbox">
              <div class="label">Triple Sharing</div>
              <div class="val">${fmtPrice(p.price_triple)}</div>
            </div>
          </div>

          <div class="section-title" style="font-size:18px;">Amenities</div>
          <div class="amenity-tags">${amenityTags(p.amenities)}</div>

          <div class="section-title" style="font-size:18px; margin-top:24px;">About this property</div>
          <p style="color:var(--text-dim); line-height:1.7;">${p.description ? p.description.replace(/\n/g,'<br>') : 'No description provided.'}</p>
          ${mapBtn}
        </div>

        <div class="sticky-side">
          <div class="contact-box">
            <div style="color:var(--text-dim); font-size:14px;">Interested in this property?</div>
            <button class="btn btn-solid btn-block" id="showContactBtn" style="margin-top:10px;">Show Contact Number</button>
            <div id="contactResult"></div>
          </div>
          <button class="whatsapp-btn" id="whatsappBtn">💬 Ask on WhatsApp</button>
        </div>
      </div>

      <div class="faq-section" id="faqContainer"></div>
    `;

    // lazy load gallery images
    lazyLoadImages(el);

    // count impression + visitor event
    ImpressionTracker.markNow(p.id);
    Visitor.trackProperty(p.id, p.city_name);

    // lightbox
    document.querySelectorAll('.gallery .gallery-item').forEach(itemEl=>{
      itemEl.addEventListener('click', ()=> Lightbox.open(images, Number(itemEl.dataset.i)));
    });

    // whatsapp
    document.getElementById('whatsappBtn').onclick = async ()=>{
      let ownerMobile = null;
      try{ const c = await apiGet(`${API}/properties/${slug}/contact`); ownerMobile = c.owner_mobile; }catch(e){}
      window.open(whatsappLink(p.name, p.slug, ownerMobile), '_blank');
    };

    // faqs
    renderFAQs(document.getElementById('faqContainer'));

    document.getElementById('showContactBtn').onclick = async ()=>{
      try{
        const c = await apiGet(`${API}/properties/${slug}/contact`);
        document.getElementById('showContactBtn').style.display='none';
        document.getElementById('contactResult').innerHTML = `
          <div class="contact-number">${c.owner_mobile || 'Not available'}</div>
          ${c.owner_mobile ? `<a class="btn btn-solid btn-block" style="margin-top:10px;" href="tel:${c.owner_mobile}">Call Now</a>` : ''}
        `;
      }catch(e){
        document.getElementById('contactResult').innerHTML = '<div style="color:var(--text-dim); margin-top:10px;">Could not load contact.</div>';
      }
    };

  }catch(e){
    el.innerHTML = '<div class="empty-state">Property not found.</div>';
  }
}
load();
</script>
</body>
</html>
